<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <!-- ページ全体のピンチ拡大を止め、アプリ内のズームだけを使う -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2a2d36" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="写チャート" />
  <title>写チャート</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="show-grid">
  <div id="app">
    <!-- ===== 上段：お手本画像 ===== -->
    <section id="topPane" class="pane">
      <div class="toolbar">
        <div class="tb-group">
          <label class="btn" title="フォルダ内の画像をまとめて開く">
            📁<span class="txt"> フォルダを開く</span>
            <input type="file" id="folderInput" webkitdirectory directory multiple hidden />
          </label>
          <label class="btn" title="画像を選ぶ（複数選択・追加選択できます）">
            🗂<span class="txt"> 画像を選ぶ</span>
            <input type="file" id="fileInput" accept="image/*" multiple hidden />
          </label>
          <button class="btn" id="prevBtn" title="前の画像 (←)">◀</button>
          <select id="imageSelect" title="画像一覧"><option>画像未選択</option></select>
          <button class="btn" id="nextBtn" title="次の画像 (→)">▶</button>
        </div>
        <span class="sep pc-sep"></span>
        <div class="tb-group">
          <button class="btn" id="zoomOutBtn" title="縮小">－</button>
          <span id="zoomLabel">100%</span>
          <button class="btn" id="zoomInBtn" title="拡大">＋</button>
          <button class="btn" id="fitBtn" title="全体表示">⤢<span class="txt"> 全体</span></button>
          <span class="sep"></span>
          <label class="chk"><input type="checkbox" id="gridToggle" checked /> グリッド</label>
          <input type="range" id="gridSize" min="20" max="200" value="50" title="グリッド間隔" />
        </div>
      </div>
      <div id="viewer" class="stage">
        <img id="refImage" alt="" draggable="false" />
        <div class="grid-overlay"></div>
        <div id="dropHint" class="hint">
          <span class="pc-only">ここに画像をドラッグ＆ドロップ<br />または「📁 フォルダを開く」から選択</span>
          <span class="mobile-only">「📁」または「🗂」から画像を選択<br />（複数選択できます）<br />1本指で移動・2本指で拡大縮小</span>
        </div>
      </div>
    </section>

    <!-- ===== 仕切り ===== -->
    <div id="splitter" title="ドラッグで高さ調整"></div>

    <!-- ===== 下段：描画エリア ===== -->
    <section id="bottomPane" class="pane">
      <div class="draw-toolbar" id="drawToolbar">
        <!-- 1段目：描画ツール7種 ＋ カラーパレット -->
        <div class="draw-row">
          <div class="tool-group" id="toolGroup">
            <button class="dt-btn tool active" data-tool="pen" title="ペン (P)">
              <svg class="fill-icon" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
            </button>
            <button class="dt-btn tool" data-tool="line" title="直線 (L)">
              <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
            </button>
            <button class="dt-btn tool" data-tool="rect" title="四角 (R)">
              <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1"/></svg>
            </button>
            <button class="dt-btn tool" data-tool="circle" title="丸 (C)">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/></svg>
            </button>
            <button class="dt-btn tool" data-tool="fill" title="塗りつぶし (F) ／ 四角・丸をタップでその色に、なければ囲まれた空白を塗る">
              <svg class="fill-icon" viewBox="0 0 24 24"><path d="M16.56 8.94L7.62 0 6.21 1.41l2.38 2.38-5.15 5.15c-.59.59-.59 1.54 0 2.12l5.5 5.5c.29.29.68.44 1.06.44s.77-.15 1.06-.44l5.5-5.5c.59-.58.59-1.53 0-2.12zM5.21 10L10 5.21 14.79 10H5.21zM19 11.5s-2 2.17-2 3.5c0 1.1.9 2 2 2s2-.9 2-2c0-1.33-2-3.5-2-3.5z"/></svg>
            </button>
            <button class="dt-btn tool" data-tool="text" title="文字 (A) ／ タップした場所に文字を入力">
              <svg class="fill-icon" viewBox="0 0 24 24"><path d="M10.9 4h2.2l5.4 14h2v2h-6.5v-2h1.8l-1.1-3H9.3l-1.1 3H10v2H3.5v-2h2L10.9 4zm-.9 9h4l-2-5.4L10 13z"/></svg>
            </button>
            <button class="dt-btn tool" data-tool="hand" title="移動 (H) ／ 2本指・スペース+ドラッグでも移動、ダブルクリックで位置リセット">
              <svg class="fill-icon" viewBox="0 0 24 24"><path d="M12 2l4 4h-2.8v4.8H18V8l4 4-4 4v-2.8h-4.8V18H16l-4 4-4-4h2.8v-4.8H6V16l-4-4 4-4v2.8h4.8V6H8l4-4z"/></svg>
            </button>
          </div>
          <div id="palette"></div>
        </div>

        <!-- 2段目：重ねる・透過・保存・グリッド・元に戻す・全消去 -->
        <div class="draw-row">
          <div class="action-group">
            <button class="dt-btn act-overlay" id="overlayBtn" title="お手本を重ねる (T)">
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="12" height="12" rx="2"/><rect x="9" y="9" width="12" height="12" rx="2"/></svg>
              <span>重ねる</span>
            </button>
            <button class="dt-btn act-opacity" id="opacityBtn" title="押すたびに10%ずつ透過率を変更" disabled>
              <svg class="fill-icon" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18V4a8 8 0 0 1 0 16z"/></svg>
              <span id="opacityLabel">透過 40%</span>
            </button>
            <button class="dt-btn act-save" id="saveBtn" title="PNG保存 (Ctrl+S)">
              <svg class="fill-icon" viewBox="0 0 24 24"><path d="M12 15.5l-4.5-4.5h3V4h3v7h3L12 15.5zM5 18h14v2H5v-2z"/></svg>
              <span>保存</span>
            </button>
            <button class="dt-btn act-icon act-grid active" id="paperGridBtn" title="方眼グリッド表示切替">
              <svg viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><path d="M12 4.5v15M4.5 12h15"/></svg>
            </button>
            <button class="dt-btn act-icon act-undo" id="undoBtn" title="元に戻す (Ctrl+Z)" disabled>
              <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            </button>
            <button class="dt-btn act-icon act-undo" id="redoBtn" title="やり直し (Ctrl+Y)" disabled>
              <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
            </button>
            <button class="dt-btn act-icon act-clear" id="clearBtn" title="全消去">
              <svg class="fill-icon" viewBox="0 0 24 24"><path d="M9 3h6l1 2h4v2H4V5h4l1-2zm1 6h2v9h-2V9zm4 0h2v9h-2V9zM6 9h12l-1 11a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L6 9z"/></svg>
            </button>
          </div>
        </div>

        <!-- 3段目：左に描画エリアの拡大縮小（－／％／＋）、中央に線の太さ（－／px／＋）、右に角度・正方形固定 -->
        <div class="draw-row draw-row-sub">
          <div class="zoom-group">
            <button class="dt-btn size-btn" id="canvasZoomOutBtn" title="縮小">
              <svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg>
            </button>
            <span id="canvasZoomLabel" class="size-indicator" title="タップで100%に戻す">100%</span>
            <button class="dt-btn size-btn" id="canvasZoomInBtn" title="拡大">
              <svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg>
            </button>
          </div>
          <div class="size-group">
            <button class="dt-btn size-btn" id="sizeDownBtn" title="線を細くする">
              <svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg>
            </button>
            <span id="sizeIndicator" class="size-indicator" aria-live="polite">
              <span id="sizeDot" class="size-dot"></span>
              <span id="sizeVal">8px</span>
            </span>
            <button class="dt-btn size-btn" id="sizeUpBtn" title="線を太くする">
              <svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg>
            </button>
          </div>
          <button class="dt-btn snap-btn" id="snapBtn" title="角度・比率固定 (Shift) ／ 直線を45°刻み、四角を正方形、丸を正円に固定">
            <svg viewBox="0 0 24 24"><path d="M4 20h16M4 20V4M4 20L19 5"/></svg>
            <span>45°/正</span>
          </button>
        </div>
      </div>

      <div id="canvasWrap" class="stage">
        <img id="overlayImage" alt="" draggable="false" />
        <!-- スワイプで動かすレイヤー（方眼・描画キャンバスを一緒に移動） -->
        <div id="canvasLayer">
          <!-- 常時表示の薄い方眼（表示のみ・保存画像には含まれない） -->
          <canvas id="paperGrid"></canvas>
          <canvas id="drawCanvas"></canvas>
          <canvas id="previewCanvas"></canvas>
        </div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
